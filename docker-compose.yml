services:
  db:
    image: mysql:8.0
    container_name: ticket_hold_db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: ticket_hold
      MYSQL_USER: ticket_user
      MYSQL_PASSWORD: ticket_password
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 12

  legacy:
    build:
      context: .
      dockerfile: docker/legacy-php/Dockerfile
    container_name: ticket_hold_legacy
    ports:
      - "8080:80"
    volumes:
      - ./legacy/public:/var/www/html
      - ./legacy/lib:/var/www/lib
    environment:
      DB_HOST: db
      DB_NAME: ticket_hold
      DB_USER: ticket_user
      DB_PASS: ticket_password
      # intentional debt: hold TTL only documented in code comments / magic number
      HOLD_MINUTES: "15"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
